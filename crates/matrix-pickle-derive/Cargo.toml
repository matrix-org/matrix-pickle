[package]
name = "matrix-pickle-derive"
version = "0.2.3"
edition = "2021"
description = "Derive support for matrix-pickle"
repository = "https://github.com/matrix-org/matrix-pickle"
license = "Apache-2.0"
rust-version = { workspace = true }

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { version = "1.0.107", default-features = false }
proc-macro-crate = { version = "3.5.0", default-features = false }
quote = { version = "1.0.47", default-features = false }
syn = { version = "3.0.3", default-features = false,  features = ["derive", "parsing", "printing", "proc-macro"] }
